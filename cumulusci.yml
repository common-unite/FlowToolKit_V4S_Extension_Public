minimum_cumulusci_version: '3.58.0'
project:
    name: FlowToolKit_V4S_Ext
    package:
        name: 'Flow Tool Kit: V4S Extension'
        namespace: FlowToolKit
        api_version: '65.0'
    dependencies:
        - github: 'https://github.com/SalesforceFoundation/Volunteers-for-Salesforce'
        # The public companion, not the private source repo: the chain from the private repo
        # carries an unmanaged unpackaged/post/config step that the MetaDeploy worker cannot
        # fetch (its GitHub App reaches only the public repos). Same package versions, same
        # release tags, and that step deploys nothing anyway (a wildcard manifest, no metadata).
        - github: 'https://github.com/common-unite/Flow_Tool_Kit_Public'
        - github: 'https://github.com/common-unite/Date_Time_Sync_Public'
    git:
    source_format: sfdx

sources:
    source_date_time_sync:
        github: 'https://github.com/common-unite/Date_Time_Sync_Public'

plans:
    # MetaDeploy plans. Frozen steps carry options, checks and ui_options only, so
    # ignore_failure never reaches the worker: every step must succeed on its own.
    # The post-install configuration lives in the post_install_config flow so the
    # exact steps a subscriber gets can be run locally against a non-namespaced org.
    install:
        slug: install
        title: Install the V4S Extension
        tier: primary
        checks:
            - when: "'Network' not in tasks.check_sobjects_available()['sobjects']"
              action: error
              message: "Digital Experiences must be enabled. Go to Setup > Digital Experiences > Settings, enable Digital Experiences, then run this installer again. The package will not install without it."
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup > Session Settings and enable 'Use Lightning Web Security for Lightning web components'. Without LWS the volunteer job finder and forms degrade badly on large datasets."
            - when: "tasks.check_extension_installed()['is_installed']"
              action: warn
              message: "The V4S Extension is already installed in this org. This plan re-applies the post-install configuration, which overwrites any changes you made to the shipped forms, page layouts, record pages and permission sets. To move to a newer version and keep those changes, use the Upgrade plan instead."
        steps:
            1:
                flow: dependencies
                ui_options:
                    description: "Installs Volunteers for Salesforce, Flow Tool Kit and Date Time Sync at the versions this release was built against. Packages the org already has at that version are skipped."
            2:
                task: install_managed
                ui_options:
                    description: "Installs the V4S Extension managed package: the volunteer job finder, the shift selector, the sign-up flows and the conversion flows. Skipped automatically if this exact version is already installed."
            3:
                task: update_admin_profile
                ui_options:
                    description: "Grants the System Administrator profile access to the extension's objects, fields, Apex classes and pages. The package ships with permissions closed. Safe to re-run."
            4:
                flow: post_install_config

    upgrade:
        slug: upgrade
        title: Upgrade the V4S Extension
        tier: additional
        preflight_message: "Upgrades the V4S Extension and its dependencies to the latest version. Your forms, page layouts, record pages, form templates and permission sets are not touched."
        checks:
            - when: "not tasks.check_extension_installed()['is_installed']"
              action: error
              message: "The V4S Extension is not installed in this org yet. Run the Install plan instead."
            - when: "not tasks.check_lws_enabled()['is_enabled']"
              action: error
              message: "Lightning Web Security (LWS) must be enabled. Go to Setup > Session Settings and enable 'Use Lightning Web Security for Lightning web components'. Without LWS the volunteer job finder and forms degrade badly on large datasets."
        steps:
            1:
                task: update_dependencies
                ui_options:
                    description: "Upgrades Volunteers for Salesforce, Flow Tool Kit and Date Time Sync to the versions this release was built against, where the org is behind."
            2:
                task: install_managed
                ui_options:
                    description: "Upgrades the V4S Extension managed package. Skipped automatically if this exact version is already installed."
            3:
                task: update_admin_profile
                ui_options:
                    description: "Grants the System Administrator profile access to anything new in this version. Safe to re-run."

    demo_portal:
        slug: demo-portal
        title: Add the Demo Volunteer Portal
        tier: additional
        preflight_message: "Creates a public Volunteer Portal site at /volunteers with sample volunteers, jobs and shifts, so you can try the job finder and sign-up flows as a guest. For sandboxes, scratch orgs and demo orgs only: it loads sample records and points every Volunteer Job in the org at a Volunteer Application template. Before running it, go to Setup > Digital Experiences > Settings and enable 'ExperienceBundle Metadata API'."
        checks:
            - when: "not tasks.check_extension_installed()['is_installed']"
              action: error
              message: "The V4S Extension is not installed in this org yet. Run the Install plan first."
            - when: "'Network' not in tasks.check_sobjects_available()['sobjects']"
              action: error
              message: "Digital Experiences must be enabled. Go to Setup > Digital Experiences > Settings and enable Digital Experiences, then run this plan again."
        steps:
            1:
                task: load_volunteer_data
                ui_options:
                    name: "Load Sample Volunteers, Jobs and Shifts"
                    description: "Creates sample Contacts, Campaigns, Volunteer Jobs, Shifts and Volunteer Roles for the portal to show. Sample data only; nothing in your existing records is changed."
            2:
                task: stamp_demo_jobs_with_templates
                ui_options:
                    name: "Point Every Job at a Volunteer Application Template"
                    description: "Sets the Volunteer Application template on every Volunteer Job in the org so each one can be applied to from the portal. Demo orgs only: this overwrites a template already chosen on a job."
            3:
                task: create_community
                options:
                    template: Build Your Own
                    name: Volunteer Portal
                    url_path_prefix: volunteers
                    skip_existing: True
                ui_options:
                    name: "Create the Volunteer Portal Site"
                    description: "Creates an Experience Cloud site named Volunteer Portal at /volunteers from the Build Your Own template. Skipped if a site with that name already exists."
            4:
                task: publish_community
                options:
                    name: Volunteer Portal
                ui_options:
                    name: "Publish the Site"
                    description: "Publishes the new site so it has a guest user to configure."
            5:
                task: execute_anon
                options:
                    path: scripts/setup-volunteer-portal-site.apex
                ui_options:
                    name: "Grant the Guest User Access"
                    description: "Assigns the Form (Flow User) and Form (Flow V4S User) permission sets to the site's guest user, and removes Campaign Members from Volunteer Campaigns so no volunteer details reach guests through the Campaign sharing rule."
            6:
                task: activate_volunteer_portal
                ui_options:
                    name: "Activate the Site"
                    description: "Sets the site's status to Live. A new site starts Under Construction, which sends guests to the login page."
            7:
                task: open_volunteer_portal_to_guests
                ui_options:
                    name: "Open the Site to Guests"
                    description: "Turns on public access for the site. Without it every page redirects guests to login, even on a live site."
            8:
                task: deploy
                options:
                    path: scratch-org/site
                ui_options:
                    name: "Deploy the Portal Pages and Guest Sharing"
                    description: "Deploys the portal's pages, navigation, branding, page assignments and the guest sharing rule on Campaign."
            9:
                task: publish_community
                options:
                    name: Volunteer Portal
                ui_options:
                    name: "Republish the Site"
                    description: "Publishes again so the deployed pages are what guests see."
            10:
                task: assert_site_usable
                ui_options:
                    name: "Verify the Site Works for Guests"
                    description: "Confirms the site is live and its guest user carries the permission sets. Fails the plan if a guest would see a login page or an empty job finder."

orgs:
    scratch:
        dev_namespaced:
            config_file: orgs/dev.json
            days: 30
            namespaced: True
        sprint_2026-08-25:
            config_file: orgs/dev.json
            days: 30
            namespaced: True
        preflight_test:
            # Bare org WITHOUT Digital Experiences, only to prove the install plan's
            # preflight checks fire on an org that lacks them. One day.
            config_file: orgs/beta.json
            days: 1
            namespaced: False
        install_test:
            # Install-testing a released managed package requires a NON-namespaced org:
            # a scratch org linked to the same namespace cannot install that namespace's package.
            config_file: orgs/dev.json
            days: 7
            namespaced: False

tasks:
    export_form:
        class_path: cci_flowtoolkit_tasks.export_form.ExportFormMetadata

    # Release-time mirror to the public companion repo: documentation, releases, and the
    # unpackaged config a subscriber deploys after install. force-app is NEVER included.
    # The public cumulusci.yml is copied verbatim, so every path a MetaDeploy plan step
    # deploys and every repo-local task class a plan references must be in this list;
    # a path the mirror never received fails at INSTALL time on the subscriber.
    github_copy_subtree:
        options:
            repo_url: "https://github.com/common-unite/FlowToolKit_V4S_Extension_Public"
            branch: "main"
            create_release: true
            release_body: true
            include: [ "cumulusci.yml","sfdx-project.json","orgs/","README.md","documents/",
                       "force-app-unpackaged-objects/","force-app-unpackaged-themes/",
                       "force-app-unpackaged-contentAssets/","force-app-unpackaged-forms/",
                       "force-app-unpackaged-layouts/","force-app-unpackaged-post/",
                       "force-app-unpackaged-datetime-sync/",
                       "scripts/","tasks/","datasets/","data/","scratch-org/" ]

    # Preflight checks for the MetaDeploy plans. Vendored from the base package into tasks/
    # because the worker runs stock CumulusCI and imports only from this repo.
    check_lws_enabled:
        class_path: tasks.check_lws_enabled.CheckLWSEnabled
        description: Preflight - is Lightning Web Security enabled?

    check_sobjects_available:
        class_path: tasks.check_sobjects_available.CheckSObjectsAvailable
        description: Preflight - list the sobject API names available in the org (Network is present only once Digital Experiences is enabled).

    check_extension_installed:
        class_path: tasks.check_package_installed.CheckPackageInstalled
        description: Preflight - is the V4S Extension already installed? Queried by package name because the extension shares the FlowToolKit namespace with the base.
        options:
            package_name: "Flow Tool Kit: V4S Extension"

    assert_site_payload:
        description: >
            Fails the flow when scratch-org/site would deploy less than it holds.
            A metadata-format deploy cannot error on components package.xml never
            requested, so a stale manifest ships nothing and still reports success.
            That hid issue #29 for months. Deliberately has NO ignore_failure.
        class_path: tasks.metadata_guard.AssertMetadataPayload
        options:
            path: scratch-org/site
            require_types: ExperienceBundle,SharingRules

    assert_site_usable:
        description: >
            Fails the flow when the demo site finished config_dev but would not
            work for a guest - not Live, or the guest user is missing its
            permission sets. Steps 50-55 are all ignore_failure, so none of them
            report these. Asserts the outcome once instead. See issue #30.
        class_path: tasks.site_guard.AssertSiteUsable
        options:
            network_name: Volunteer Portal

    activate_volunteer_portal:
        description: Activates the Volunteer Portal site (Network.Status = Live). A new site is UnderConstruction, which sends guests to the login page.
        class_path: cumulusci.tasks.command.SalesforceCommand
        options:
            command: bash scripts/activate-volunteer-portal.sh

    open_volunteer_portal_to_guests:
        description: Sets isAvailableToGuests on the Volunteer Portal ExperienceBundle. Without it every route redirects guests to login, even on a Live site.
        class_path: cumulusci.tasks.command.SalesforceCommand
        options:
            command: bash scripts/open-volunteer-portal-to-guests.sh

    deploy_unpackaged_objects:
        description: Deploys Form Object CMDT and custom fields
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/objects

    deploy_unpackaged_themes:
        description: Deploys Form Theme CMDT records
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/themes

    deploy_unpackaged_content_assets:
        description: Deploys volunteer banner content assets
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/contentAssets

    deploy_unpackaged_forms:
        description: Deploys Form parent CMDT records
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/forms

    deploy_unpackaged_layout_metadata:
        description: Deploys page layouts for V4S objects
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/layouts

    deploy_unpackaged_post_metadata:
        description: Deploys Lightning App and FlexiPages
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/post

    deploy_unpackaged_datetime_sync:
        description: Deploys Date Time Sync trigger, test, and CMDT config for Volunteer Shifts
        class_path: cumulusci.tasks.salesforce.Deploy
        options:
            path: unpackaged/config/datetime_sync

    load_volunteer_data:
        class_path: cumulusci.tasks.bulkdata.generate_and_load_data_from_yaml.GenerateAndLoadDataFromYaml
        description: Generate and load volunteer test data from Snowfakery recipe
        options:
            generator_yaml: datasets/snowfakery_recipe.yml
            drop_missing_schema: True

    load_form_templates:
        class_path: cumulusci.tasks.bulkdata.generate_and_load_data_from_yaml.GenerateAndLoadDataFromYaml
        description: Load the two Volunteer Application form templates. These are product config, not demo data - they are what an admin points a Volunteer Job at, so every org needs them. Always follow with cleanup_auto_created_template_children.
        options:
            generator_yaml: datasets/form_templates_recipe.yml
            drop_missing_schema: True

    cleanup_auto_created_template_children:
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        description: Remove the empty default page and section that base package triggers auto-insert on every new template. Without this the rendered form shows a stray blank Primary Contact Information page. Safe to re-run, and it never touches Volunteer Jobs.
        options:
            path: scripts/cleanup-auto-created-template-children.apex

    stamp_demo_jobs_with_templates:
        class_path: cumulusci.tasks.apex.anon.AnonymousApexTask
        description: DEMO ORGS ONLY - point every Volunteer Job in the org at a Volunteer Application template. Deliberately unfiltered, so it would overwrite a client's hand-configured jobs. Never add this to an install path.
        options:
            path: scripts/stamp-demo-jobs-with-templates.apex

    inject_conversion_type_value:
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        description: Add the Volunteer Application option to the base package's Conversion Type picklist. This is the controlling value the volunteer conversion rule hangs off of.
        options:
            picklists: FlowToolKit__Form_Template__c.FlowToolKit__Conversion_Type__c
            entries:
                - fullName: Volunteer Application
                  label: Volunteer Application

    inject_conversion_rule_value:
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        description: Add the Volunteer Application option to the base package's Conversion Rules picklist. All four volunteer conversion flows check for this value before they run, so without it nothing converts. Conversion Rules is a dependent picklist, so inject_conversion_rule_dependency must run after this to make the option selectable.
        options:
            picklists: FlowToolKit__Form_Template__c.FlowToolKit__Conversion_Rules__c
            entries:
                - fullName: Volunteer Application
                  label: Volunteer Application

    inject_conversion_rule_dependency:
        class_path: tasks.picklist_dependency.AddPicklistDependencies
        description: Make the volunteer conversion rules selectable under the Volunteer Application conversion type. Conversion Rules is a dependent picklist, so adding a value is only half the job - unmapped, the option is hidden in the UI and any attempt to save it is rejected. Maps the Volunteer Application rule plus the Contact1/Contact2/Account rule families. Run after inject_conversion_rule_value.
        options:
            object_api_name: FlowToolKit__Form_Template__c
            field_api_name: FlowToolKit__Conversion_Rules__c
            controlling_field_api_name: FlowToolKit__Conversion_Type__c
            dependencies:
                - value: Contact1
                  controlling_values:
                      - Volunteer Application
                - value: Contact1 👉 Set Mailing Address
                  controlling_values:
                      - Volunteer Application
                - value: Contact1 👉 Set Other Address
                  controlling_values:
                      - Volunteer Application
                - value: Contact1 👉 Create Campaign Member
                  controlling_values:
                      - Volunteer Application
                - value: Contact2
                  controlling_values:
                      - Volunteer Application
                - value: Contact2 👉 Set Mailing Address
                  controlling_values:
                      - Volunteer Application
                - value: Contact2 👉 Set Other Address
                  controlling_values:
                      - Volunteer Application
                - value: Contact2 👉 Create Campaign Member
                  controlling_values:
                      - Volunteer Application
                - value: Account
                  controlling_values:
                      - Volunteer Application
                - value: Account 👉 Set Billing Address
                  controlling_values:
                      - Volunteer Application
                - value: Account 👉 Set Shipping Address
                  controlling_values:
                      - Volunteer Application
                - value: Contact1 👉 Add to Account
                  controlling_values:
                      - Volunteer Application
                - value: Contact2 👉 Add to Account
                  controlling_values:
                      - Volunteer Application
                - value: Volunteer Application
                  controlling_values:
                      - Volunteer Application

    inject_controller_map_flow_value:
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        description: Add the volunteer controller clone to the base package's Conversion Map Flow Controller picklist, so an admin can select it on a Form Template.
        options:
            picklists: FlowToolKit__Form_Template__c.FlowToolKit__Conversion_Map_Flow_Controller__c
            entries:
                - fullName: FlowToolKit__Form_Submission_Convert_Process_Form_Submission_Volunteer_Overridable
                  label: Volunteer Application Controller

    inject_contact1_map_flow_value:
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        description: Add the volunteer Contact mapping clone to the base package's Conversion Map Flow Contact1 picklist, so an admin can select it on a Form Template.
        options:
            picklists: FlowToolKit__Form_Template__c.FlowToolKit__Conversion_Map_Flow_Contact1__c
            entries:
                - fullName: FlowToolKit__Form_Submission_Convert_Process_Contact_Volunteer_Overridable
                  label: Volunteer Contact Mapping

    inject_account_map_flow_value:
        class_path: cumulusci.tasks.metadata_etl.picklists.AddPicklistEntries
        description: Add the volunteer group Account mapping clone to the base package's Conversion Map Flow Account picklist, so an admin can select it on a Form Template.
        options:
            picklists: FlowToolKit__Form_Template__c.FlowToolKit__Conversion_Map_Flow_Account__c
            entries:
                - fullName: FlowToolKit__Form_Submission_Convert_Process_Account_Volunteer_Overridable
                  label: Volunteer Group Account Mapping

    robot:
        options:
            suites: robot/FlowToolKit_V4SF_Ext/tests
            options:
                outputdir: robot/FlowToolKit_V4SF_Ext/results

    robot_testdoc:
        options:
            path: robot/FlowToolKit_V4SF_Ext/tests
            output: robot/FlowToolKit_V4SF_Ext/doc/cUnite_FormBuilder_V4SF_tests.html

    run_tests:
        options:
            required_org_code_coverage_percent: 75

flows:
    # The post-install configuration a subscriber org needs, in subscriber shape: the
    # unpackaged directories deployed as-is (they carry literal FlowToolKit__ prefixes, #24)
    # and the picklist injections with their prefixed defaults. config_dev applies the same
    # steps to namespaced dev orgs, where it must override the picklist names to bare ones,
    # which is why the two cannot share one definition. Runs inside the install plan and
    # stands alone for testing: cci flow run post_install_config --org install_test
    post_install_config:
        description: Post-install configuration for an org with the package installed. Deployed as-is in subscriber shape; see the install plan.
        steps:
            1:
                task: deploy
                options:
                    path: force-app-unpackaged-objects
                ui_options:
                    name: "Deploy Volunteer Role and Volunteer Fields"
                    description: "Adds the Volunteer Role object, the extension's fields on Volunteer Job, Shift, Hours, Campaign, Account and Lead, and the Form Object definitions the volunteer forms are built on."
            2:
                task: deploy
                options:
                    path: force-app-unpackaged-themes
                ui_options:
                    name: "Deploy Form Themes"
                    description: "Two Form Theme records that style the volunteer forms."
            3:
                task: deploy
                options:
                    path: force-app-unpackaged-contentAssets
                ui_options:
                    name: "Deploy Site Images"
                    description: "The banner and illustration images the volunteer forms and portal pages display."
            4:
                task: deploy
                options:
                    path: force-app-unpackaged-forms
                ui_options:
                    name: "Deploy Volunteer Forms"
                    description: "The form definitions: job details, shift tables, registration, waiver and group sign-up."
            5:
                task: deploy
                options:
                    path: force-app-unpackaged-datetime-sync
                ui_options:
                    name: "Deploy Shift Date and Time Sync"
                    description: "Keeps each Volunteer Shift's start and end Date/Time in step with its separate date and time fields, through Date Time Sync configuration and a trigger."
            6:
                task: deploy
                options:
                    path: force-app-unpackaged-layouts
                ui_options:
                    name: "Deploy Page Layouts"
                    description: "Page layouts for Volunteer Job, Shift, Hours and Volunteer Role with the extension's fields placed."
            7:
                task: deploy
                options:
                    path: force-app-unpackaged-post
                ui_options:
                    name: "Deploy the Volunteers App and Record Pages"
                    description: "The Volunteers Lightning app, record pages for Job, Shift and Hours, the Form Template Sources that let a form template read a Volunteer Job or Shift, and the two V4S permission sets."
            8:
                task: update_admin_profile
                ui_options:
                    name: "Grant Admin Access to the New Fields"
                    description: "Re-grants the System Administrator profile access to everything deployed in the previous steps. Without it the Form Template Sources drop out of queries and the form templates loaded next come up incomplete."
            9:
                task: inject_conversion_type_value
                ui_options:
                    name: "Add the Volunteer Application Conversion Type"
                    description: "Adds Volunteer Application to Flow Tool Kit's Conversion Type picklist on Form Template. The volunteer conversion rule hangs off this value."
            10:
                task: inject_conversion_rule_value
                ui_options:
                    name: "Add the Volunteer Application Conversion Rule"
                    description: "Adds Volunteer Application to the Conversion Rules picklist. All four volunteer conversion flows check for this value before they run."
            11:
                task: inject_conversion_rule_dependency
                ui_options:
                    name: "Map the Conversion Rule to Its Type"
                    description: "Conversion Rules is a dependent picklist, so the new value is hidden until it is mapped under the Volunteer Application type. Also maps the Contact and Account rule families."
            12:
                task: inject_controller_map_flow_value
                ui_options:
                    name: "Register the Volunteer Controller Flow"
                    description: "Makes the volunteer conversion controller selectable on a Form Template."
            13:
                task: inject_contact1_map_flow_value
                ui_options:
                    name: "Register the Volunteer Contact Mapping Flow"
                    description: "Makes the volunteer Contact mapping selectable on a Form Template."
            14:
                task: inject_account_map_flow_value
                ui_options:
                    name: "Register the Volunteer Group Account Mapping Flow"
                    description: "Makes the volunteer group Account mapping selectable on a Form Template."
            15:
                task: load_form_templates
                ui_options:
                    name: "Load the Volunteer Application Form Templates"
                    description: "Creates the two Volunteer Application form templates an admin points a Volunteer Job at. Product configuration, not sample data."
            16:
                task: cleanup_auto_created_template_children
                ui_options:
                    name: "Remove Auto-Created Template Pages"
                    description: "Removes the empty page and section Flow Tool Kit adds to every new template, which would otherwise render as a blank Primary Contact Information page."
            17:
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User,Form_Flow_V4S_Admin,Form_Flow_V4S_User
                ui_options:
                    name: "Assign Permission Sets to You"
                    description: "Assigns Form (Builder Admin), Form (Flow User), Form (Flow V4S Admin) and Form (Flow V4S User) to the user running this installer, so you can configure forms and run the sign-up flows right away. Other users are assigned in Setup."

    release_2gp_beta:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest_beta"

    release_2gp_production:
        steps:
            90:
                task: github_copy_subtree
                options:
                    tag_name: "latest"

    deploy_unpackaged_config:
        description: Deploys all unpackaged metadata in dependency order
        steps:
            1:
                task: dx_convert_from
                options:
                    src_dir: unpackaged/config/objects
                    extra: -r force-app-unpackaged-objects
            1.1:
                task: deploy_unpackaged_objects
            2:
                task: dx_convert_from
                options:
                    src_dir: unpackaged/config/themes
                    extra: -r force-app-unpackaged-themes
            2.1:
                task: deploy_unpackaged_themes
            3:
                task: dx_convert_from
                options:
                    src_dir: unpackaged/config/contentAssets
                    extra: -r force-app-unpackaged-contentAssets
            3.1:
                task: deploy_unpackaged_content_assets
            4:
                task: dx_convert_from
                options:
                    src_dir: unpackaged/config/forms
                    extra: -r force-app-unpackaged-forms
            4.1:
                task: deploy_unpackaged_forms

    deploy_unpackaged_datetime_sync_config:
        description: Converts and deploys Date Time Sync unpackaged components
        steps:
            1:
                task: dx_convert_from
                options:
                    src_dir: unpackaged/config/datetime_sync
                    extra: -r force-app-unpackaged-datetime-sync
            1.1:
                task: deploy_unpackaged_datetime_sync
                options:
                    unmanaged: true

    deploy_unpackaged_layouts:
        steps:
            1:
                task: dx_convert_from
                options:
                    src_dir: unpackaged/config/layouts
                    extra: -r force-app-unpackaged-layouts
            1.1:
                task: deploy_unpackaged_layout_metadata

    deploy_unpackaged_post:
        steps:
            1:
                task: dx_convert_from
                options:
                    src_dir: unpackaged/config/post
                    extra: -r force-app-unpackaged-post
            1.1:
                task: deploy_unpackaged_post_metadata
                options:
                    unmanaged: true

    config_dev:
        steps:
            30:
                flow: deploy_unpackaged_config
            31:
                flow: deploy_unpackaged_datetime_sync_config
            39.9:
                # The unpackaged fields deployed at steps 30-39 have no FLS for the running
                # admin until the profile is regranted, so the org describe omits them and
                # load_volunteer_data (drop_missing_schema) silently drops every one: Roles
                # loaded with only Name, no Job carried a Role. Grant before loading. See #37.
                task: update_admin_profile
            40:
                task: load_volunteer_data
            41:
                flow: deploy_unpackaged_layouts
            42:
                flow: deploy_unpackaged_post
            # Add the volunteer options to the base package's picklists. Without these the
            # volunteer conversion flows have nothing to be selected by and never run.
            #
            # The task definitions carry the FlowToolKit__ prefix because that is how the
            # base package's fields are named in a subscriber org, which is what the client
            # post-install steps target. A namespaced scratch org sees those same fields
            # WITHOUT the prefix, so each step below overrides the picklists option.
            42.1:
                task: inject_conversion_type_value
                options:
                    picklists: Form_Template__c.Conversion_Type__c
            42.2:
                task: inject_conversion_rule_value
                options:
                    picklists: Form_Template__c.Conversion_Rules__c
            42.3:
                task: inject_conversion_rule_dependency
                options:
                    object_api_name: Form_Template__c
                    field_api_name: Conversion_Rules__c
                    controlling_field_api_name: Conversion_Type__c
            42.4:
                task: inject_controller_map_flow_value
                options:
                    picklists: Form_Template__c.Conversion_Map_Flow_Controller__c
            42.5:
                task: inject_contact1_map_flow_value
                options:
                    picklists: Form_Template__c.Conversion_Map_Flow_Contact1__c
            42.6:
                task: inject_account_map_flow_value
                options:
                    picklists: Form_Template__c.Conversion_Map_Flow_Account__c
            # The form templates are config, so they load on the install path and
            # not with the demo data at step 40. The cleanup immediately after is
            # required, not optional: base package triggers add an empty default
            # page and section to every template on insert. See issue #26.
            42.7:
                task: load_form_templates
            42.8:
                task: cleanup_auto_created_template_children
            43:
                # The base package's Form_Builder_Admin/Form_Flow_User are the ONLY permission
                # sets that grant FlowToolKit__Form_Submission_Upsert, which ships restricted
                # (isAdditionalPermissionRequiredToRun). Without them any submission carrying
                # related records - or any guest/iframe save - fails to start the interview with
                # "Insufficient Privileges". The V4S pair grants only the V4S flows.
                # See cUnite_FormBuilder#566.
                task: assign_permission_sets
                options:
                    api_names: Form_Builder_Admin,Form_Flow_User,Form_Flow_V4S_Admin,Form_Flow_V4S_User
            44:
                # Re-grant admin FLS on unpackaged fields deployed at steps 30-42.
                # Without this, Form_Template_Source__mdt rows whose MetadataRelationship
                # values point at those fields drop out of SOQL entirely. See issue #8.
                task: update_admin_profile
            45:
                # Demo only. Stamps EVERY Volunteer Job in the org, so it belongs
                # in config_dev and must never reach a client install path.
                task: stamp_demo_jobs_with_templates
            # Demo Experience Cloud site. Guest-facing rendering is a core part of
            # the product, so every dev org gets a site to test in.
            50:
                task: create_community
                options:
                    template: Build Your Own
                    name: Volunteer Portal
                    url_path_prefix: volunteers
                    skip_existing: True
                ignore_failure: True
            51:
                task: publish_community
                options:
                    name: Volunteer Portal
                ignore_failure: True
            52:
                task: execute_anon
                description: Assign guest user permission sets for the Volunteer Portal site
                options:
                    path: scripts/setup-volunteer-portal-site.apex
                ignore_failure: True
            53:
                task: activate_volunteer_portal
                ignore_failure: True
            53.1:
                task: open_volunteer_portal_to_guests
                ignore_failure: True
            53.9:
                task: assert_site_payload
                description: Guards that the captured site is actually declared in package.xml. No ignore_failure, on purpose - see #30.
            54:
                task: deploy
                description: Built Volunteer Portal site (guest sharing rules, page assignments). No-ops until the site has been captured once, see scratch-org/site/README.md
                options:
                    path: scratch-org/site
                ignore_failure: True
            55:
                task: publish_community
                description: Republish so the captured site configuration is live for the guest user
                options:
                    name: Volunteer Portal
                ignore_failure: True
            55.1:
                task: assert_site_usable
                description: Guards that the demo site is genuinely usable by a guest. No ignore_failure, on purpose - see #30.
