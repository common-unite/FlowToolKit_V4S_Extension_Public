    Description__c: "<p>Event crews run everything guests do not see: the table and staging setup, signage, check-in desk, silent auction tables, parking flow, and the teardown that turns a gala back into an empty hall by midnight. Shifts are split by task so you can pick setup, service, or teardown.</p><p>The best fit for people who like a clear job and a visible finish line, and for groups who want to work a shift together.</p>"
    Training_URL__c: "https://training.example.org/orientation/event-crew"
    Remote__c: false
