# Snowfakery Recipe: Volunteer Job Finder Test Data
# Generates Campaigns, Volunteer Jobs, and Volunteer Shifts with
# relative dates so data is always current when loaded.
#
# Usage:
#   cci task run generate_and_load_from_yaml --org dev_namespaced \
#       -o generator_yaml datasets/snowfakery_recipe.yml
#
# Or via the CCI flow defined in cumulusci.yml:
#   cci flow run config_dev --org dev_namespaced

