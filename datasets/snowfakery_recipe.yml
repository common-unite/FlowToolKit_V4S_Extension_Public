    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:groups"
    Testimonial_Quote__c: "<p>Every porch conversation is different. Neighbors just want honest answers.</p>"
    Testimonial_Attribution__c: "Tessa V. · Canvass partner"
    Excerpt__c: "<p>Meet neighbors where they already are: a farmers market table, a phone list, a block party. The role that grows every other role.</p>"
    Requirements__c: "<p>Comfortable starting conversations with strangers. Phone banking shifts can be done from home with a laptop and a headset.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteersHandsIn
    Description__c: "<p>Ambassadors are how new neighbors find us. You staff a farmers market table, canvass a block with a partner, or work a phone list from home, answering honest questions about programs and pointing people to the right signup. Every conversation is logged so the team can follow up.</p><p>Training covers the talking points, the boundaries of what we promise, and how to hand off a neighbor who needs more than information. Ambassadors who stick with it often move into leading a canvass team.</p>"
    Remote__c: true
- object: Volunteer_Role__c
  nickname: role_sponsor
  fields:
    Name: "Program Sponsor"
    Active__c: true
    Category__c: Other
    Indoor_Outdoor__c: Mixed
    Preferred_Skills__c: basic accounting;Fundraising
    Minimum_Age__c: 18
    Adult_Supervision_Age__c: 18
    Background_Check_Required__c: false
    Training_Required__c: false
    Physical_Requirements__c: "<p>No physical requirements. This is a recurring support commitment, not shift work.</p>"
    Typical_Time_Commitment__c: "A monthly commitment with open-barn visit days"
    What_to_Wear__c: "<p>Come as you are for visits; boots recommended around the barn.</p>"
    What_We_Provide__c: "<p>Updates on your sponsored program and invitations to open days.</p>"
    Accommodations_Available__c: "<p>Every sponsor visit day has an accessible route through the barn and kitchen, and updates are available in large print or by phone on request.</p>"
    Waiver_Language__c: "<p>I understand that barn visits happen around large animals and working equipment. I release the organization, its staff, and its partners from liability for injuries arising from ordinary volunteer activity, and I consent to emergency medical treatment if I cannot be reached.</p>"
    FAQ__c: "<p><b>Is a sponsorship tax deductible?</b> Yes, in full; you receive a receipt for each payment and a year-end summary.</p><p><b>Can I visit what I sponsor?</b> Yes. Open days run quarterly and sponsors are the first invited.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:money"
    Testimonial_Quote__c: "<p>Sponsoring a horse costs less than my coffee habit and does a lot more good.</p>"
    Testimonial_Attribution__c: "The Nguyen Family · Sponsors since 2025"

    Excerpt__c: "<p>Sponsorship is a standing commitment rather than a shift. Sponsors get program updates, site visits, and named recognition at events.</p>"
    Requirements__c: "<p>No physical requirements. Sponsors complete a short intake conversation so we can match the commitment to the right program.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteerHorseTherapy2
    Description__c: "<p>Program sponsors fund a specific animal, rider, or route for a year and stay connected to it. Sponsors receive quarterly updates, an invitation to open-barn and open-kitchen days, and named recognition at the annual gala. Sponsorship is a standing commitment rather than shift work, which makes it the right fit for supporters who cannot volunteer on a schedule.</p><p>A short intake conversation matches each sponsor to the program that fits, and sponsors are always welcome to add a shift when they can.</p>"
    Skills_Needed__c: Fundraising
    Training_URL__c: "https://training.example.org/sponsor-briefing"
    Remote__c: true

