- object: Volunteer_Role__c
  nickname: role_outdoor_cleanup
  fields:
    Name: "Outdoor Cleanup Crew"
    Active__c: true
    Category__c: Cleanup
    Indoor_Outdoor__c: Outdoor
    Skills_Needed__c: Manual Labor
    Preferred_Skills__c: Landscaping;Manual Labor
    Minimum_Age__c: 14
    Adult_Supervision_Age__c: 16
    Background_Check_Required__c: false
    Training_Required__c: false
    Physical_Requirements__c: "<p>Comfortable standing and walking for a full shift; bending and lifting up to 25 pounds.</p>"
    Typical_Time_Commitment__c: "3-4 hour shifts, outdoors in most weather"
    What_to_Wear__c: "<p>Closed-toe shoes and weather-appropriate layers. Long pants recommended.</p>"
    What_We_Provide__c: "<p>Gloves, grabbers, bags, water, and sunscreen.</p>"
    Accommodations_Available__c: "<p>Every cleanup has a pavilion station for sorting and tallying that involves no walking or lifting. Paved-trail assignments are available on request for anyone who cannot manage uneven ground.</p>"
    Waiver_Language__c: "<p>I understand that outdoor cleanup work involves uneven terrain, roadside areas, and handling of discarded materials. I release the organization, its staff, and its partners from liability for injuries arising from ordinary volunteer activity, and I consent to emergency medical treatment if I cannot be reached.</p>"
    FAQ__c: "<p><b>What if it rains?</b> We work in light rain and cancel for lightning; you will get a text two hours before the shift either way.</p><p><b>Can I bring my kids?</b> See the minimum age above; younger volunteers need an adult on the same shift.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:trail"
    Testimonial_Quote__c: "<p>I signed up alone for one Saturday and ended up coming back every month. You can see exactly where your work went.</p>"
    Testimonial_Attribution__c: "Marisol T. · 38 shifts since 2024"
    Excerpt__c: "<p>The most visible volunteering we do. Four hours, a full bag count at the end, and a park that looks different when you leave than when you arrived.</p>"
    Requirements__c: "<p>Able to walk uneven ground for most of a shift and lift up to 25 pounds. No experience needed; a crew lead runs every shift.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteerParkCleanup
    Description__c: "<p>Cleanup crews are the backbone of our parks and waterways work. Each shift gathers at a pavilion, splits into teams of four to six with a crew lead, and works a marked section of trail, shoreline, or roadside. You will bag litter, clear debris from drains and paths, and log the count at the end so we can report acres restored to the city.</p><p>No two shifts look the same: spring brings storm debris, summer brings event litter, autumn brings leaf and brush work. Groups, families with teens, and first-timers all fit here.</p>"
    Training_URL__c: "https://training.example.org/orientation/outdoor-cleanup"
    Remote__c: false
- object: Volunteer_Role__c
  nickname: role_warehouse_sorter
  fields:
    Name: "Warehouse Sorter"
    Active__c: true
    Category__c: Warehouse
    Indoor_Outdoor__c: Indoor
    Skills_Needed__c: Manual Labor
    Minimum_Age__c: 14
    Adult_Supervision_Age__c: 16
    Background_Check_Required__c: false
    Training_Required__c: false
    Physical_Requirements__c: "<p>Steady standing work on a sorting line; repetitive lifting up to 20 pounds.</p>"
    Typical_Time_Commitment__c: "2-4 hour line shifts with a mid-shift break"
    What_to_Wear__c: "<p>Closed-toe shoes required on the warehouse floor.</p>"
    What_We_Provide__c: "<p>Gloves, aprons, and a locker for your things.</p>"
    Accommodations_Available__c: "<p>Seated sorting stations and the label-and-scan desk involve no lifting. Tell us at signup and we will hold one for you; the warehouse floor is step-free throughout.</p>"
    Waiver_Language__c: "<p>I understand that warehouse work involves conveyor equipment, pallets, and moving carts. I release the organization, its staff, and its partners from liability for injuries arising from ordinary volunteer activity, and I consent to emergency medical treatment if I cannot be reached.</p>"
    FAQ__c: "<p><b>Is the warehouse cold?</b> The sorting floor is kept around 65°F; the produce cooler is colder, and cooler assignments come with a jacket.</p><p><b>Can I bring my kids?</b> See the minimum age above; younger volunteers need an adult on the same shift.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:package"
    Testimonial_Quote__c: "<p>Two hours on the line flies by. The team makes it fun and the pallets don't stand a chance.</p>"
    Testimonial_Attribution__c: "Derek W. · Tuesday regular"
    Excerpt__c: "<p>Sorting and boxing donated food in a climate-controlled warehouse. Steady work, good music, and a clear count of meals packed at the end of every shift.</p>"
    Requirements__c: "<p>Standing at a sorting table for up to three hours, lifting boxes up to 30 pounds. Seated sorting stations are available on request.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteerFoodSort
    Description__c: "<p>Sorters keep the food bank moving. Donations arrive by the pallet and leave as packed family boxes, and everything in between happens on the sorting line: checking dates, culling damaged goods, weighing, and boxing by category. A line lead sets the pace and calls the meal count when the shift ends.</p><p>This is the shift to pick when you want clear tasks, a climate-controlled room, and a number at the end that tells you exactly what you did.</p>"
    Preferred_Skills__c: Computer usage
    Training_URL__c: "https://training.example.org/orientation/warehouse-floor"
    Remote__c: false
- object: Volunteer_Role__c
  nickname: role_kitchen_crew
  fields:
    Name: "Community Kitchen Crew"
    Active__c: true
    Category__c: Food Service
    Indoor_Outdoor__c: Indoor
    Skills_Needed__c: Manual Labor
    Preferred_Skills__c: Event Planning
    Minimum_Age__c: 16
    Adult_Supervision_Age__c: 18
    Background_Check_Required__c: false
    Training_Required__c: true
    Training_URL__c: "https://training.example.org/food-handler"
    Physical_Requirements__c: "<p>Fast-paced standing work near hot equipment; lifting stock pots with a partner.</p>"
    Typical_Time_Commitment__c: "4-hour prep or service shifts"
    What_to_Wear__c: "<p>Closed-toe non-slip shoes. Hair ties for long hair.</p>"
    What_We_Provide__c: "<p>Aprons, hairnets, gloves, and a staff meal.</p>"
    Accommodations_Available__c: "<p>Dining-room host and beverage-station roles are seated or low-movement and away from hot equipment. Fragrance-free and glove-only prep stations are available on request.</p>"
    Waiver_Language__c: "<p>I understand that kitchen work involves knives, hot surfaces, and food allergens. I release the organization, its staff, and its partners from liability for injuries arising from ordinary volunteer activity, and I consent to emergency medical treatment if I cannot be reached.</p>"
    FAQ__c: "<p><b>I have a food allergy. Can I still volunteer?</b> Yes. Tell us at signup and we will keep you on stations away from that allergen.</p><p><b>Can I bring my kids?</b> See the minimum age above; younger volunteers need an adult on the same shift.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:food_and_drink"
    Testimonial_Quote__c: "<p>Chef runs a tight, joyful kitchen. I have learned more knife skills here than anywhere.</p>"
    Testimonial_Attribution__c: "Priya S. · 60 meals plated weekly"
    Excerpt__c: "<p>Everything from chopping prep to plating a hot meal and resetting the dining room. Our longest-running shift and the one volunteers most often come back to.</p>"
    Requirements__c: "<p>Closed-toe shoes required. Food handler training is provided on your first shift; no certification needed in advance.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteerHospitality
    Description__c: "<p>The kitchen crew preps, cooks, plates, and serves a hot meal for up to 120 neighbors, then resets the dining room for the next day. Prep shifts run knives and stock pots under the chef; service shifts run the line and the dining room, where the conversation matters as much as the food.</p><p>Food handler training happens on your first shift, and regulars are rostered onto a fixed weekly slot so the chef can plan the menu around a crew that knows the kitchen.</p>"
    Remote__c: false
- object: Volunteer_Role__c
  nickname: role_delivery_driver
  fields:
    Name: "Delivery Driver"
    Active__c: true
    Category__c: Transportation
    Indoor_Outdoor__c: Mixed
    Preferred_Skills__c: Computer usage
    Minimum_Age__c: 21
    Adult_Supervision_Age__c: 21
    Background_Check_Required__c: true
    Training_Required__c: true
    Training_URL__c: "https://training.example.org/delivery-driver"
    Physical_Requirements__c: "<p>Loading and carrying boxes to the door; getting in and out of a vehicle repeatedly.</p>"
    Typical_Time_Commitment__c: "2-3 hour routes on a fixed schedule"
    What_to_Wear__c: "<p>Comfortable clothes and supportive shoes.</p>"
    What_We_Provide__c: "<p>Route sheets, a loaded vehicle or mileage reimbursement, and a phone contact for every stop.</p>"
    Accommodations_Available__c: "<p>Curbside routes with no carrying are available, and a navigator seat on the agency van suits anyone who would rather not drive. Tell us at signup and we will match you.</p>"
    Waiver_Language__c: "<p>I understand that delivery driving requires a valid license, uses my own or an agency vehicle, and involves entering private residences. I release the organization, its staff, and its partners from liability for injuries arising from ordinary volunteer activity, and I consent to emergency medical treatment if I cannot be reached.</p>"
    FAQ__c: "<p><b>Do I need my own car?</b> Most routes use your vehicle with mileage reimbursed; the county routes run in an agency van with a second volunteer.</p><p><b>Can I bring my kids?</b> See the minimum age above; younger volunteers need an adult on the same shift.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:location"
    Testimonial_Quote__c: "<p>Some weeks I am the only person my seniors see. The route takes two hours; the visits are the point.</p>"
    Testimonial_Attribution__c: "Gene R. · Route 7 driver"
    Excerpt__c: "<p>Pick up a packed route, deliver to neighbors on it, and check back in. Most routes take under two hours and you set your own pace.</p>"
    Requirements__c: "<p>Valid driver license, current insurance, and a vehicle with trunk or back-seat space. We reimburse mileage on request.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteerSeniorHomeDelivery
    Description__c: "<p>Drivers pick up a packed route of eight to twelve stops, deliver meals or groceries to homebound neighbors, and check in with each of them at the door. For many recipients the driver is the only visitor that day, so a route takes as long as the conversations do.</p><p>Routes are fixed, so you meet the same people each week. You use your own vehicle with mileage reimbursed, or take an agency van on the longer county routes.</p>"
    Skills_Needed__c: Manual Labor
    Remote__c: false
- object: Volunteer_Role__c
  nickname: role_animal_care
  fields:
    Name: "Animal Care Assistant"
    Active__c: true
    Category__c: Animal Care
    Indoor_Outdoor__c: Mixed
    Skills_Needed__c: Manual Labor
    Minimum_Age__c: 16
    Adult_Supervision_Age__c: 18
    Background_Check_Required__c: false
    Training_Required__c: true
    Training_URL__c: "https://training.example.org/animal-handling"
    Physical_Requirements__c: "<p>Kneeling, scrubbing, and controlling dogs up to 80 pounds on leash.</p>"
    Typical_Time_Commitment__c: "Flexible 2-hour shifts, mornings busiest"
    What_to_Wear__c: "<p>Clothes that can get dirty and closed-toe shoes.</p>"
    What_We_Provide__c: "<p>Leashes, waste bags, treats, and a dog-handling orientation.</p>"
    Accommodations_Available__c: "<p>Cat socializing and laundry-and-supply prep are seated, low-exertion roles with no large-animal handling. Tell us at signup and we will reserve one for you.</p>"
    Waiver_Language__c: "<p>I understand that working with shelter animals carries a risk of scratches and bites, and animal behavior cannot be fully predicted. I release the organization, its staff, and its partners from liability for injuries arising from ordinary volunteer activity, and I consent to emergency medical treatment if I cannot be reached.</p>"
    FAQ__c: "<p><b>Will I be matched with a specific animal?</b> Regulars are paired with the same dogs each week so the animals see a familiar face; drop-in shifts take whoever needs a walk.</p><p><b>Can I bring my kids?</b> See the minimum age above; younger volunteers need an adult on the same shift.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:animal_and_nature"
    Testimonial_Quote__c: "<p>The first walk of the morning is the best part of my week, for me and for the dogs.</p>"
    Testimonial_Attribution__c: "Alexis M. · 120 walks logged"
    Excerpt__c: "<p>Shelter animals need handling every day, not just on adoption weekends. This is the shift that keeps them ready for a home.</p>"
    Requirements__c: "<p>Comfortable around dogs and cats of any size. Bite-prevention and handling training is required before your first solo shift.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteerDog1
    Description__c: "<p>Animal care assistants walk, feed, and socialize shelter dogs and cats, clean kennels and catteries, and note behavior for the adoption team. Morning shifts are the busiest, when every animal needs to be out, fed, and settled before the shelter opens to the public.</p><p>The handling orientation covers reading body language, leash control, and bite prevention; after your first supervised shift you are cleared to walk on your own.</p>"
    Preferred_Skills__c: Event Planning
    Remote__c: false
- object: Volunteer_Role__c
  nickname: role_therapy_sidewalker
  fields:
    Name: "Therapy Ride Side-Walker"
    Active__c: true
    Category__c: Therapy Support
    Indoor_Outdoor__c: Outdoor
    Preferred_Skills__c: Event Planning
    Minimum_Age__c: 16
    Adult_Supervision_Age__c: 18
    Background_Check_Required__c: true
    Training_Required__c: true
    Training_URL__c: "https://training.example.org/side-walker"
    Physical_Requirements__c: "<p>Walking beside a moving horse with arms raised for the length of a session.</p>"
    Typical_Time_Commitment__c: "90-minute sessions on a weekly commitment"
    What_to_Wear__c: "<p>Long pants and hard-toe shoes. No dangling jewelry.</p>"
    What_We_Provide__c: "<p>Session training, a horse-handling orientation, and a mentor for your first month.</p>"
    Accommodations_Available__c: "<p>Arena-side roles, such as running the mounting block, timing sessions, and greeting families, involve no walking beside a horse. Tell us at signup and we will place you there.</p>"
    Waiver_Language__c: "<p>I understand that working around horses carries inherent risk, and I will follow the instructor and horse leader at all times. I release the organization, its staff, and its partners from liability for injuries arising from ordinary volunteer activity, and I consent to emergency medical treatment if I cannot be reached.</p>"
    FAQ__c: "<p><b>Do I need to be strong?</b> You need to walk at horse pace for a lesson and keep an arm raised; the horse leader carries the load. Nobody lifts a rider alone.</p><p><b>Can I bring my kids?</b> See the minimum age above; younger volunteers need an adult on the same shift.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
    Service_Hours_Letter_Available__c: true
    Role_Icon__c: "utility:heart"
    Testimonial_Quote__c: "<p>Watching my rider trot on her own for the first time had the whole arena in tears.</p>"
    Testimonial_Attribution__c: "Sam K. · Side-walker, 3 seasons"
    Excerpt__c: "<p>Side-walkers make therapeutic riding possible. You walk beside the horse for a 45-minute lesson, steady the rider, and follow the instructor's lead.</p>"
    Requirements__c: "<p>Able to walk at horse pace for a full lesson on soft footing. Horse experience is welcome but not required; we train every side-walker on site.</p>"
    Banner_Image__c: /file-asset-public/FlowToolKit__FlowToolKit_VolunteerHorseTherapy
    Description__c: "<p>Side-walkers make therapeutic riding possible. In a 45-minute lesson you walk beside the horse, keep a hand on the rider when the instructor asks for it, and help with the exercises that build balance, core strength, and confidence. Every rider has a horse leader and one or two side-walkers.</p><p>Sessions run on a weekly commitment for the length of a term so riders work with the same team. Horse experience is welcome but not needed; the barn trains every side-walker on site.</p>"
    Skills_Needed__c: Manual Labor
    Remote__c: false
- object: Volunteer_Role__c
  nickname: role_event_support
  fields:
