    FAQ__c: "<p><b>Do I get to attend the event?</b> Crew on service shifts see the whole program from the floor; setup and teardown crews are welcome to stay for the reception between their shifts.</p><p><b>Can I bring my kids?</b> See the minimum age above; younger volunteers need an adult on the same shift.</p><p><b>Do you sign service hour forms?</b> Yes. Bring your form to check-in or request a signed letter any time.</p>"
